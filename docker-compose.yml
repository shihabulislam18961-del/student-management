
services:
  student-app:
    build: .
    container_name: student-app
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: attendance-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root12345
      MYSQL_DATABASE: students
      MYSQL_USER: student
      MYSQL_PASSWORD: student123
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: student-nginx
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  mysql_data:
